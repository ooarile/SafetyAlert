server {
    listen 80;
    server_name _;
    charset utf-8;

    # 발신 테스트 페이지
    root /usr/share/nginx/html;
    autoindex on;

    # 설치 패키지 배포 경로. 다른 PC에서 내려받아 설치할 때 씁니다. (사내망 전용)
    location /dl/ {
        alias /srv/dist/;
        autoindex on;
        autoindex_exact_size off;
        add_header Content-Disposition "attachment";
    }
}
